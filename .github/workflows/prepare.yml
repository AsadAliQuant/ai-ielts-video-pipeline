name: Prepare IELTS Video

# Stage 1+2 of the pipeline: generate the test paper and synthesize audio,
# then upload the test bundle as an artifact. The image handoff happens
# outside Actions (MUSE generates the visuals), then the Render workflow
# finishes the video and uploads to YouTube.
on:
  workflow_dispatch:
    inputs:
      band:
        description: "Target band"
        default: "7.0"
        required: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Stage 1 - generate test paper
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python -u generate_test.py \
            --band "${{ github.event.inputs.band || '7.0' }}" \
            --provider gemini \
            --skip-verify

      - name: Locate generated test dir
        id: testdir
        run: |
          DIR=$(ls -d tests/test_* 2>/dev/null | sort | tail -n 1)
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Generated: $DIR"

      - name: Stage 2 - synthesize audio
        env:
          FISH_AUDIO: ${{ secrets.FISH_AUDIO }}
        run: python generate_audio.py "${{ steps.testdir.outputs.dir }}"

      - name: Publish to SaaS pool (D1 + R2)
        continue-on-error: true # R2 skipped intentionally for now -- don't block video/YouTube upload
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python publish_test.py "${{ steps.testdir.outputs.dir }}"

      - name: Write handoff manifest
        run: |
          python3 - "${{ steps.testdir.outputs.dir }}" "${{ github.run_id }}" <<'EOF'
          import json, sys
          test_dir, run_id = sys.argv[1], sys.argv[2]
          json.dump({"test_dir": test_dir, "prep_run_id": run_id},
                    open(f"{test_dir}/handoff.json", "w"))
          EOF

      - name: Upload test bundle for image handoff
        uses: actions/upload-artifact@v4
        with:
          name: test-bundle-${{ github.run_id }}
          path: |
            ${{ steps.testdir.outputs.dir }}/test.json
            ${{ steps.testdir.outputs.dir }}/audio
            ${{ steps.testdir.outputs.dir }}/handoff.json
          retention-days: 3 # auto-deleted by the render run after upload; short fallback so leftovers expire fast

      - name: Upload run artifacts on failure
        if: failure() && steps.testdir.outputs.dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: failed-prepare-${{ github.run_id }}
          path: ${{ steps.testdir.outputs.dir }}
          retention-days: 7
