name: Render + Upload IELTS Video

# Stage 3+4 of the pipeline. Triggered after the image handoff: the visuals
# (tests/<dir>/visuals/*.png) are already committed to the repo, and the
# test bundle (test.json + audio) is restored from the prepare run's artifact.
# Renders with --skip-visuals so no image API is called, then uploads to YouTube.
on:
  workflow_dispatch:
    inputs:
      test_dir:
        description: "Test dir, e.g. tests/test_007"
        required: true
      prep_run_id:
        description: "Prepare run id whose test-bundle artifact to restore"
        required: true
      video_date:
        description: "Video date as YYYY-MM-DD; used in title, description, thumbnail, and YouTube scheduled publish"
        required: true
      publish_time:
        description: "Publish time of day as HH:MM:SSZ (UTC); e.g. 03:00:00Z = 08:00 PKT, 18:45:00Z = 23:45 PKT"
        required: false
        default: "03:00:00Z"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read    # checkout
      actions: write    # download the prepare run's test-bundle artifact + delete artifacts after upload

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Install ffmpeg and emoji font
        # Inter is bundled in assets/fonts; only color emoji comes from the OS
        # (the title card uses the clock and memo emoji).
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-color-emoji

      - name: Verify bundled fonts load
        run: python -c "import fonts; fonts.selftest()"

      - name: Restore test bundle from prepare run
        uses: actions/download-artifact@v4
        with:
          name: test-bundle-${{ inputs.prep_run_id }}
          run-id: ${{ inputs.prep_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ inputs.test_dir }}

      - name: Deduplicate visual ids
        # The test generator occasionally emits the same visual id in more than
        # one part (e.g. two "v1" visuals). The pipeline maps visuals by id to
        # tests/<dir>/visuals/<id>.png, so duplicates collide and question
        # groups would show the wrong image. Rename later duplicates (v1 -> v2
        # -> ...) and repoint the matching question group in the same part.
        run: |
          python - <<'EOF'
          import json, re
          from pathlib import Path
          p = Path("${{ inputs.test_dir }}") / "test.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          seen = {}
          renamed = []
          def next_id(vid):
              m = re.match(r"^(.*?)(\d+)$", vid)
              base, n = (m.group(1), int(m.group(2))) if m else (vid + "-", 1)
              cand = f"{base}{n + 1}"
              while cand in seen:
                  n += 1
                  cand = f"{base}{n + 1}"
              return cand
          for part in data.get("parts", []):
              for v in part.get("visuals", []):
                  vid = str(v.get("id") or "").strip()
                  if not vid:
                      continue
                  if vid in seen:
                      new_vid = next_id(vid)
                      qs = set(v.get("questions") or [])
                      for g in part.get("question_groups", []):
                          if str(g.get("visual_id") or "") == vid:
                              gf, gt = g.get("from"), g.get("to")
                              try:
                                  rng = set(range(int(gf), int(gt) + 1)) if gf is not None and gt is not None else set()
                              except (TypeError, ValueError):
                                  rng = set()
                              if qs & rng:
                                  g["visual_id"] = new_vid
                                  break
                      v["id"] = new_vid
                      renamed.append((vid, new_vid))
                      seen[new_vid] = True
                  else:
                      seen[vid] = True
          if renamed:
              p.write_text(json.dumps(data, indent=1, ensure_ascii=False), encoding="utf-8")
              print("renamed duplicate visual ids:", renamed)
          else:
              print("visual ids unique, no changes")
          EOF

      - name: Stage 3 - render video (visuals supplied)
        run: python generate_video.py "${{ inputs.test_dir }}" --fast --skip-visuals --video-date "${{ inputs.video_date }}"

      - name: Stage 4 - upload to YouTube (scheduled)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ secrets.YOUTUBE_PRIVACY }}
        run: python youtube_upload.py "${{ inputs.test_dir }}" --date "${{ inputs.video_date }}" --publish-at "${{ inputs.video_date }}T${{ inputs.publish_time }}"

      - name: Upload run artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-render-${{ github.run_id }}
          path: ${{ inputs.test_dir }}
          retention-days: 7

      - name: Delete Actions artifacts (free storage)
        # The video is now uploaded and scheduled on YouTube, so the Actions
        # artifacts have served their purpose. Delete them so the 0.5 GB
        # included Actions storage never fills up. Runs only when everything
        # above succeeded - on failure the artifacts are kept for debugging.
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          # 1) Delete this run's own artifacts (none expected on success).
          for id in $(gh api "repos/$REPO/actions/runs/${{ github.run_id }}/artifacts" --paginate -q '.artifacts[].id'); do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null && echo "deleted render-run artifact $id"
          done
          # 2) Delete the prepare run's test bundle - no longer needed once the video is on YouTube.
          BID=$(gh api "repos/$REPO/actions/runs/${{ inputs.prep_run_id }}/artifacts" -q '.artifacts[] | select(.name == "test-bundle-${{ inputs.prep_run_id }}") | .id' | head -n 1)
          if [ -n "${BID:-}" ]; then
            gh api -X DELETE "repos/$REPO/actions/artifacts/$BID" >/dev/null && echo "deleted prepare bundle artifact $BID"
          else
            echo "prepare bundle artifact already gone"
          fi
