name: Daily IELTS Video

on:
  schedule:
    # Runs 3x/day, 8 hours apart (cron is always UTC) -- edit to taste
    - cron: "0 3 * * *"
    - cron: "0 11 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      band:
        description: "Target band"
        default: "7.0"
        required: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Install ffmpeg and emoji font
        # Inter is bundled in assets/fonts; only color emoji comes from the OS
        # (the title card uses the clock and memo emoji).
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-color-emoji

      - name: Verify bundled fonts load
        run: python -c "import fonts; fonts.selftest()"

      - name: Stage 1 - generate test paper
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python -u generate_test.py \
            --band "${{ github.event.inputs.band || '7.0' }}" \
            --provider gemini \
            --skip-verify

      - name: Locate generated test dir
        id: testdir
        if: always()
        run: |
          DIR=$(ls -d tests/test_* 2>/dev/null | sort | tail -n 1)
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Generated: $DIR"

      - name: Stage 2 - synthesize audio
        env:
          FISH_AUDIO: ${{ secrets.FISH_AUDIO }}
        run: python generate_audio.py "${{ steps.testdir.outputs.dir }}"

      - name: Publish to SaaS pool (D1 + R2)
        continue-on-error: true # R2 skipped intentionally for now -- don't block video/YouTube upload
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python publish_test.py "${{ steps.testdir.outputs.dir }}"

      - name: Stage 3 - render video
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: python generate_video.py "${{ steps.testdir.outputs.dir }}" --fast

      - name: Stage 4 - upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ secrets.YOUTUBE_PRIVACY }}
        run: python youtube_upload.py "${{ steps.testdir.outputs.dir }}"

      - name: Upload run artifacts on failure
        if: failure() && steps.testdir.outputs.dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: failed-run-${{ github.run_id }}
          path: ${{ steps.testdir.outputs.dir }}
          retention-days: 7
